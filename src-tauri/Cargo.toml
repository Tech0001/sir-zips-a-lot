[package]
name = "sir-zips-a-lot-desktop"
version = "0.1.1"
edition = "2024"
publish = false

[[bin]]
name = "sir-zips-a-lot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sir-zips-a-lot = { path = ".." }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
