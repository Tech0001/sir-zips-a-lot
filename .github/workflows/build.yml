name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p sir-zips-a-lot --all-targets --locked -- -D warnings
      - run: cargo test -p sir-zips-a-lot --locked

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Sir-Zips-a-Lot-Windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
