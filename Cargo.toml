[package]
name = "sir-zips-a-lot"
version = "0.1.1"
edition = "2024"
description = "Find new orders, zip them up, and send them on their way."
publish = false

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
